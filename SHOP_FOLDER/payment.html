<!DOCTYPE html>
<html>
<head>
    <title>Payment - Cottage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .payment-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            padding: 40px;
        }

        h2 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }

        .order-summary {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            color: #666;
        }

        .summary-row.total {
            border-top: 2px solid #ddd;
            margin-top: 10px;
            padding-top: 10px;
            font-weight: bold;
            color: #333;
            font-size: 1.2em;
        }

        .card-form {
            margin-top: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .card-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .card-number {
            position: relative;
        }

        .card-icons {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 5px;
        }

        .card-icons i {
            font-size: 24px;
            color: #666;
        }

        .pay-button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s;
            margin-top: 20px;
        }

        .pay-button:hover {
            transform: translateY(-2px);
        }

        .pay-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .secure-badge {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 14px;
        }

        .secure-badge i {
            color: #28a745;
            margin-right: 5px;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
    <!-- Add Font Awesome or Boxicons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css">
</head>
<body>
    <div class="payment-container">
        <h2>Complete Your Payment</h2>
        
        <div class="order-summary" id="orderSummary">
            <!-- Will be filled by JavaScript -->
        </div>

        <form id="paymentForm" class="card-form">
            <div class="form-group">
                <label>Cardholder Name</label>
                <input type="text" id="cardName" placeholder="John Doe" required>
            </div>

            <div class="form-group card-number">
                <label>Card Number</label>
                <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19" required>
                <div class="card-icons">
                    <i class='bx bxl-visa'></i>
                    <i class='bx bxl-mastercard'></i>
                    <i class='bx bxl-amex'></i>
                </div>
            </div>

            <div class="card-row">
                <div class="form-group">
                    <label>Expiry Date</label>
                    <input type="text" id="expiry" placeholder="MM/YY" maxlength="5" required>
                </div>
                <div class="form-group">
                    <label>CVV</label>
                    <input type="text" id="cvv" placeholder="123" maxlength="3" required>
                </div>
            </div>

            <button type="submit" class="pay-button" id="payButton">
                Pay $<span id="paymentAmount">0.00</span>
            </button>

            <div class="secure-badge">
                <i class='bx bx-lock'></i>
                Your payment information is secure and encrypted
            </div>
        </form>

        <div class="back-link">
            <a href="checkout.html">← Back to Checkout</a>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        
        // Load order summary
        async function loadOrderSummary() {
            try {
                // Get cart items
                const cart = JSON.parse(localStorage.getItem('cart')) || [];
                
                if (cart.length === 0) {
                    window.location.href = 'shop.html';
                    return;
                }
                
                // Calculate totals
                const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                const shipping = subtotal > 50 ? 0 : 5.99;
                const total = subtotal + shipping;
                
                // Display order summary
                const summaryHtml = `
                    <div class="summary-row">
                        <span>Subtotal:</span>
                        <span>$${subtotal.toFixed(2)}</span>
                    </div>
                    <div class="summary-row">
                        <span>Shipping:</span>
                        <span>${shipping === 0 ? 'Free' : '$' + shipping.toFixed(2)}</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total:</span>
                        <span>$${total.toFixed(2)}</span>
                    </div>
                `;
                
                document.getElementById('orderSummary').innerHTML = summaryHtml;
                document.getElementById('paymentAmount').textContent = total.toFixed(2);
                
            } catch (error) {
                console.error("Error loading order:", error);
            }
        }

        // Format card number
        document.getElementById('cardNumber').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            value = value.replace(/(\d{4})/g, '$1 ').trim();
            e.target.value = value;
        });

        // Format expiry date
        document.getElementById('expiry').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length >= 2) {
                value = value.substring(0, 2) + '/' + value.substring(2, 4);
            }
            e.target.value = value;
        });

        // Only allow numbers for CVV
        document.getElementById('cvv').addEventListener('input', function(e) {
            e.target.value = e.target.value.replace(/\D/g, '');
        });

        // Handle payment submission
        document.getElementById('paymentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const payButton = document.getElementById('payButton');
            payButton.disabled = true;
            payButton.textContent = 'Processing...';
            
            // Simulate payment processing
            setTimeout(async () => {
                try {
                    // Here you would integrate with a real payment processor
                    // like Stripe, PayPal, etc.
                    
                    // Clear cart after successful payment
                    localStorage.removeItem('cart');
                    
                    // If user is logged in, clear Firebase cart
                    if (auth.currentUser) {
                        // Add code to clear Firebase cart here
                    }
                    
                    // Show success message
                    alert('Payment successful! Thank you for your purchase.');
                    
                    // Redirect to order confirmation
                    window.location.href = 'confirmation.html';
                    
                } catch (error) {
                    console.error("Payment error:", error);
                    alert('Payment failed. Please try again.');
                    payButton.disabled = false;
                    payButton.textContent = 'Pay $' + document.getElementById('paymentAmount').textContent;
                }
            }, 2000);
        });

        // Load summary on page load
        loadOrderSummary();
    </script>
</body>
</html>
